<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal · Sear</title>
<style>
  :root { --primary:#325346; --bg:#faf9fb; --card:#ffffff; --text:#1b1c1e; --muted:#414844; --line:#e3e2e4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.6 -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 20px 64px; }
  .brand { color:var(--primary); font-weight:600; letter-spacing:.08em; text-transform:uppercase; font-size:12px; margin-bottom:12px; }
  article { background:var(--card); border-radius:16px; padding:28px 24px; box-shadow:0 4px 24px rgba(24,25,27,.05); }
  h1 { font-size:28px; line-height:1.2; margin:0 0 16px; }
  h2 { font-size:20px; margin:32px 0 8px; color:var(--primary); }
  h3 { font-size:17px; margin:20px 0 6px; }
  p, li { color:var(--muted); }
  a { color:var(--primary); }
  table { width:100%; border-collapse:collapse; margin:12px 0; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--text); }
  nav { margin-top:24px; display:flex; gap:16px; font-size:14px; }
</style>
</head>
<body>
<main>
<div class="brand">Sear</div>
<article>
<h1>Sear legal</h1><ul><li><a href="sear/terms/">Terms of Use</a></li><li><a href="sear/privacy/">Privacy Policy</a></li></ul>
</article>
<nav></nav>
</main>
</body>
</html>
